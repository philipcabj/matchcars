# Config de Firebase App Hosting para portal/ — vive en su propio subdominio
# (portal.matchcars.app), no proxeado desde marketplace/ (ver next.config.ts).
env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyCd4KkX_631fNBA7yaPowzCJpNOem12-sw
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: matchcars-a7847.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: matchcars-a7847
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: matchcars-a7847.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "56428663464"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:56428663464:ios:7a9f0c20b6e3fb3a43e89d"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://portal.matchcars.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_MARKETPLACE_URL
    value: https://matchcars.app
    availability:
      - BUILD
      - RUNTIME
  # Google Maps JavaScript API — picker de ubicación de agencia
  # (LocationPicker.tsx). Restringida en Google Cloud a
  # localhost:3000/* y portal.matchcars.app/*, solo Maps JavaScript API.
  - variable: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
    value: AIzaSyBW0goyLrBb7BGJ1SVjnhMns0yMmjvXPFs
    availability:
      - BUILD
      - RUNTIME
  # DSN público de Sentry (no es secreto — identifica el proyecto, no
  # autentica nada) — ver portal/src/instrumentation-client.ts,
  # sentry.server.config.ts y sentry.edge.config.ts.
  - variable: NEXT_PUBLIC_SENTRY_DSN
    value: https://91f32ab717e0a9c4e75bc834beed4710@o4511967088541696.ingest.us.sentry.io/4511967170265089
    availability:
      - BUILD
      - RUNTIME
  # @sentry/cli (dependencia de @sentry/nextjs) baja un binario nativo en el
  # postinstall — sin SENTRY_AUTH_TOKEN no lo necesitamos para nada (solo
  # sirve para subir sourcemaps) y esa descarga es la sospecha más probable
  # de por qué el build en Cloud Build fallaba sin un motivo legible.
  - variable: SENTRYCLI_SKIP_DOWNLOAD
    value: "1"
    availability:
      - BUILD
